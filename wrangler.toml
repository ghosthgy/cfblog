name = "cfblog"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Local development settings
# Note: AI binding will still connect to remote even in local mode
# This is expected behavior and will incur usage charges

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "cfblog-db"
database_id = "a974cd4d-03a3-4877-af28-dfe21f09a9a4"

# R2 Storage binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cfblog-media"

# KV cache binding
# Create namespaces first:
#   npx wrangler kv namespace create CACHE
#   npx wrangler kv namespace create CACHE --preview
# Then uncomment and replace the ids below.
[[kv_namespaces]]
binding = "CACHE"
id = "a3e2019f81684ec0a84810d26fd30b71"
# preview_id = "your-preview-kv-namespace-id"

# Workers AI binding
# Note: In local dev mode, AI still connects to remote Cloudflare AI
[ai]
binding = "AI"

[assets]
binding = "ASSETS"
directory = "./public"
not_found_handling = "none"
run_worker_first = true
